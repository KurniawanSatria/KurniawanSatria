<svg viewBox="0 0 1000 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack marquee">
  <title>Tech Stack</title>
  <style>
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px; font-weight: 700; fill: #222;
    }
    @media (prefers-color-scheme: dark) { .text { fill: #f0f6fc; } }
  </style>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="10%" stop-color="white" />
      <stop offset="90%" stop-color="white" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <mask id="mask"><rect x="0" y="0" width="1000" height="140" fill="url(#fade)" /></mask>
  </defs>
  <g mask="url(#mask)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="25s" repeatCount="indefinite" />
      <g transform="translate(0,10)" role="img" aria-label="TypeScript"><title>TypeScript</title><image href="https://cdn.simpleicons.org/typescript" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">TypeScript</text></g>
      <g transform="translate(250,10)" role="img" aria-label="React"><title>React</title><image href="https://cdn.simpleicons.org/react" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">React</text></g>
      <g transform="translate(500,10)" role="img" aria-label="Next.js"><title>Next.js</title><image href="https://cdn.simpleicons.org/nextdotjs/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Next.js</text></g>
      <g transform="translate(750,10)" role="img" aria-label="Node.js"><title>Node.js</title><image href="https://cdn.simpleicons.org/nodedotjs" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Node.js</text></g>
      <g transform="translate(1000,10)" role="img" aria-label="OpenCode"><title>OpenCode</title><image href="https://cdn.simpleicons.org/opencode/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">OpenCode</text></g>
      <g transform="translate(1250,10)" role="img" aria-label="Vercel"><title>Vercel</title><image href="https://cdn.simpleicons.org/vercel/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Vercel</text></g>
      <g transform="translate(1500,10)" aria-hidden="true"><image href="https://cdn.simpleicons.org/typescript" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">TypeScript</text></g>
      <g transform="translate(1750,10)" aria-hidden="true"><image href="https://cdn.simpleicons.org/react" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">React</text></g>
      <g transform="translate(2000,10)" aria-hidden="true"><image href="https://cdn.simpleicons.org/nextdotjs/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Next.js</text></g>
      <g transform="translate(2250,10)" aria-hidden="true"><image href="https://cdn.simpleicons.org/nodedotjs" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Node.js</text></g>
      <g transform="translate(2500,10)" aria-hidden="true"><image href="https://cdn.simpleicons.org/opencode/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">OpenCode</text></g>
      <g transform="translate(2750,10)" aria-hidden="true"><image href="https://cdn.simpleicons.org/vercel/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Vercel</text></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-1500 0" to="0 0" dur="30s" repeatCount="indefinite" />
      <g transform="translate(0,80)" role="img" aria-label="PostgreSQL"><title>PostgreSQL</title><image href="https://cdn.simpleicons.org/postgresql" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">PostgreSQL</text></g>
      <g transform="translate(250,80)" role="img" aria-label="MongoDB"><title>MongoDB</title><image href="https://cdn.simpleicons.org/mongodb" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">MongoDB</text></g>
      <g transform="translate(500,80)" role="img" aria-label="Docker"><title>Docker</title><image href="https://cdn.simpleicons.org/docker" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Docker</text></g>
      <g transform="translate(750,80)" role="img" aria-label="Tailwind CSS"><title>Tailwind CSS</title><image href="https://cdn.simpleicons.org/tailwindcss" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Tailwind</text></g>
      <g transform="translate(1000,80)" role="img" aria-label="GitHub"><title>GitHub</title><image href="https://cdn.simpleicons.org/github/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">GitHub</text></g>
      <g transform="translate(1250,80)" role="img" aria-label="Firebase"><title>Firebase</title><image href="https://cdn.simpleicons.org/firebase" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Firebase</text></g>
      <g transform="translate(1500,80)" aria-hidden="true"><image href="https://cdn.simpleicons.org/postgresql" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">PostgreSQL</text></g>
      <g transform="translate(1750,80)" aria-hidden="true"><image href="https://cdn.simpleicons.org/mongodb" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">MongoDB</text></g>
      <g transform="translate(2000,80)" aria-hidden="true"><image href="https://cdn.simpleicons.org/docker" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Docker</text></g>
      <g transform="translate(2250,80)" aria-hidden="true"><image href="https://cdn.simpleicons.org/tailwindcss" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Tailwind</text></g>
      <g transform="translate(2500,80)" aria-hidden="true"><image href="https://cdn.simpleicons.org/github/white" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">GitHub</text></g>
      <g transform="translate(2750,80)" aria-hidden="true"><image href="https://cdn.simpleicons.org/firebase" x="0" y="0" width="48" height="48"/><text x="64" y="32" class="text">Firebase</text></g>
    </g>
  </g>
</svg>