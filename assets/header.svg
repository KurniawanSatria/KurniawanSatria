<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <title>Kurniawan Satria — Backend Developer</title>
  <style>
    .name { animation: nameIn 0.9s ease-out both; }
    .underline { animation: underlineDraw 0.9s ease-out 0.3s both; transform-origin: left center; }
    .meta { animation: fadeUp 0.9s ease-out 0.5s both; }
    .corner { animation: cornerSlide 0.9s ease-out both; }

    @keyframes nameIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes underlineDraw {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cornerSlide {
      0% { opacity: 0; transform: translateX(-8px); }
      100% { opacity: 0.6; transform: translateX(0); }
    }
  </style>
  <rect width="800" height="320" fill="#0A0A0A"/>
  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#ffffff"/>
    <rect x="40" y="42" width="2" height="22" fill="#ffffff"/>
  </g>

  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#ffffff"/>
      <rect x="40" y="42" width="2" height="22" fill="#ffffff"/>
    </g>
  </g>

  <text class="name" x="400" y="138" text-anchor="middle" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="56" font-weight="700" letter-spacing="-1.5">KURNIAWAN SATRIA</text>

  <rect class="underline" x="176" y="164" width="448" height="2" fill="#ffffff" rx="1"/>

  <text class="meta" x="400" y="200" text-anchor="middle" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">BACKEND DEVELOPER   ·   ISLAMIC UNIVERSITY OF RIAU   ·   INDONESIA</text>
</svg>
