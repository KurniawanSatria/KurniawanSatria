<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .heading { animation: slidein 12s ease-out infinite; }
    .bio { animation: fade 12s ease-in-out infinite; }
    .pill { animation: pillpop 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .p0 { animation-delay: 0.4s }
    .p1 { animation-delay: 0.52s }
    .p2 { animation-delay: 0.64s }
    .accentbar { animation: bar 12s ease-out infinite; transform-origin: top left; }

    @keyframes slidein {
      0% { opacity: 0; transform: translateX(-12px) }
      8% { opacity: 1; transform: translateX(0) }
      90% { opacity: 1; transform: translateX(0) }
      100% { opacity: 0; transform: translateX(0) }
    }
    @keyframes fade {
      0%, 8% { opacity: 0 }
      18% { opacity: 1 }
      90% { opacity: 1 }
      100% { opacity: 0 }
    }
    @keyframes pillpop {
      0%, 14% { opacity: 0; transform: scale(0.85) }
      22% { opacity: 1; transform: scale(1) }
      90% { opacity: 1; transform: scale(1) }
      100% { opacity: 0; transform: scale(1) }
    }
    @keyframes bar {
      0% { transform: scaleY(0) }
      10% { transform: scaleY(1) }
      90% { transform: scaleY(1) }
      100% { transform: scaleY(1) }
    }
  </style>

  <rect x="32" y="32" width="3" height="256" fill="#ffffff" rx="1.5" class="accentbar"/>

  <text class="heading" x="56" y="86" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="32" font-weight="700">Hi, I&apos;m Kurniawan Satria.</text>

  <text class="bio" x="56" y="136" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="15" font-weight="400">
    <tspan x="56" dy="0">an <tspan font-weight="700">Informatics Engineering student</tspan> at <tspan font-weight="700">Islamic University of Riau</tspan></tspan>
    <tspan x="56" dy="22">from Pekanbaru, Indonesia.</tspan>
    <tspan x="56" dy="22"><tspan font-weight="700">I love automation</tspan> way too much.</tspan>
    <tspan x="56" dy="22">If something can be automated, I&apos;ll probably automate it.</tspan>
    <tspan x="56" dy="22">I build backend services, bots, web automation,</tspan>
    <tspan x="56" dy="22">and infrastructure to handle the boring stuff, so I don&apos;t have to.</tspan>
  </text>

  <image href="avatar.gif" x="610" y="70" width="200" height="200" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(56 270)">
    <g class="pill p0">
      <rect width="134" height="20.13" rx="10.065" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="67" y="10.065" fill="#ffffff" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" dominant-baseline="middle">Backend Developer</text>
    </g>
  </g>

  <g transform="translate(198 270)">
    <g class="pill p1">
      <rect width="194" height="20.13" rx="10.065" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="97" y="10.065" fill="#ffffff" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" dominant-baseline="middle">Islamic University of Riau</text>
    </g>
  </g>

  <g transform="translate(400 270)">
    <g class="pill p2">
      <rect width="154" height="20.13" rx="10.065" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="77" y="10.065" fill="#ffffff" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle" dominant-baseline="middle">Pekanbaru, Indonesia</text>
    </g>
  </g>
</svg>