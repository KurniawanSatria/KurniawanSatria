<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <title>Activity</title>
  <style>
    .heading { animation: slidein 12s ease-out infinite; }
    .underline { animation: bar 12s ease-out infinite; transform-origin: left center; }
    .meta { animation: fade 12s ease-in-out infinite; }
    .corner { animation: cornerSlide 12s ease-out infinite; }
    .stat { animation: fadeUp 12s ease-out infinite; }
    .s0 { animation-delay: 0.3s }
    .s1 { animation-delay: 0.4s }
    .s2 { animation-delay: 0.5s }
    .s3 { animation-delay: 0.6s }
    .lang-bar { animation: bar 12s ease-out infinite; transform-origin: left center; }

    @keyframes slidein {
      0% { opacity: 0; transform: translateX(-12px) }
      8% { opacity: 1; transform: translateX(0) }
      90% { opacity: 1; transform: translateX(0) }
      100% { opacity: 0; transform: translateX(0) }
    }
    @keyframes bar {
      0%, 14% { transform: scaleX(0) }
      24%, 88% { transform: scaleX(1) }
      100% { transform: scaleX(1) }
    }
    @keyframes fade {
      0%, 22% { opacity: 0 }
      32%, 90% { opacity: 1 }
      100% { opacity: 0 }
    }
    @keyframes fadeUp {
      0%, 22% { opacity: 0; transform: translateY(8px) }
      36%, 90% { opacity: 1; transform: translateY(0) }
      100% { opacity: 0; transform: translateY(0) }
    }
    @keyframes cornerSlide {
      0%, 8% { opacity: 0; transform: translateX(-8px) }
      18%, 90% { opacity: 0.6; transform: translateX(0) }
      100% { opacity: 0; transform: translateX(0) }
    }
  </style>

  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#ffffff"/>
    <rect x="40" y="42" width="2" height="22" fill="#ffffff"/>
  </g>

  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#ffffff"/>
      <rect x="40" y="42" width="2" height="22" fill="#ffffff"/>
    </g>
  </g>

  <text class="heading" x="48" y="84" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="36" font-weight="700" letter-spacing="-1.2">Activity.</text>
  <rect class="underline" x="48" y="96" width="181" height="2" fill="#ffffff" rx="1"/>

  <text class="meta" x="48" y="120" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">@KURNIAWANSATRIA   ·   317 CONTRIBUTIONS   ·   GRAPHQL</text>

  <g transform="translate(48 156)">
    <g class="stat s0">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REPOS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">12</text>
      <text x="0" y="60" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">8 indexed</text>
    </g>
  </g>

  <g transform="translate(230 156)">
    <g class="stat s1">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">COMMITS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">252</text>
      <text x="0" y="60" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
    </g>
  </g>

  <g transform="translate(412 156)">
    <g class="stat s2">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">PRS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">1</text>
      <text x="0" y="60" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">1 this year</text>
    </g>
  </g>

  <g transform="translate(594 156)">
    <g class="stat s3">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REVIEWS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">0</text>
      <text x="0" y="60" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
    </g>
  </g>

  <rect x="48" y="254" width="704" height="6" rx="3" fill="#a3a3a3" fill-opacity="0.2"/>

  <g class="lang-bar">
    <rect x="48" y="254" width="620.928" height="6" rx="3" fill="#ffffff"/>
    <rect x="668.928" y="254" width="64.064" height="6" rx="3" fill="#737373"/>
    <rect x="732.992" y="254" width="19.008" height="6" rx="3" fill="#404040"/>
  </g>

  <g>
    <rect x="48" y="279" width="8" height="8" rx="2" fill="#ffffff"/>
    <text x="64" y="286" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">JAVASCRIPT  88%</text>
  </g>

  <g>
    <rect x="282.667" y="279" width="8" height="8" rx="2" fill="#737373"/>
    <text x="298.667" y="286" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">CSS  9%</text>
  </g>

  <g>
    <rect x="517.333" y="279" width="8" height="8" rx="2" fill="#404040"/>
    <text x="533.333" y="286" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">HTML  3%</text>
  </g>
</svg>
