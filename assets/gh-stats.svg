<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <title>Activity</title>
  <style>
    .heading { animation: slidein 0.8s ease-out both; }
    .underline { animation: bar 0.9s ease-out 0.2s both; transform-origin: left center; }
    .meta { animation: fade 0.9s ease-in-out 0.3s both; }
    .corner { animation: cornerSlide 0.9s ease-out both; }
    .stat { animation: fadeUp 0.7s ease-out both; }
    .s0 { animation-delay: 0.4s }
    .s1 { animation-delay: 0.5s }
    .s2 { animation-delay: 0.6s }
    .s3 { animation-delay: 0.7s }
    .xp { animation: fadeUp 0.7s ease-out 0.35s both; }
    .xp-bar { animation: bar 1s ease-out 0.5s both; transform-origin: left center; }
    .lang-bar { animation: bar 1s ease-out 0.7s both; transform-origin: left center; }
    .legend { animation: fade 0.9s ease-in-out 0.9s both; }

    @keyframes slidein {
      0% { opacity: 0; transform: translateX(-12px) }
      100% { opacity: 1; transform: translateX(0) }
    }
    @keyframes bar {
      0% { transform: scaleX(0) }
      100% { transform: scaleX(1) }
    }
    @keyframes fade {
      0% { opacity: 0 }
      100% { opacity: 1 }
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px) }
      100% { opacity: 1; transform: translateY(0) }
    }
    @keyframes cornerSlide {
      0% { opacity: 0; transform: translateX(-8px) }
      100% { opacity: 0.6; transform: translateX(0) }
    }
  </style>

  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#ffffff"/>
    <rect x="40" y="42" width="2" height="22" fill="#ffffff"/>
  </g>

  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#ffffff"/>
      <rect x="40" y="42" width="2" height="22" fill="#ffffff"/>
    </g>
  </g>

  <text class="heading" x="48" y="84" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="36" font-weight="700" letter-spacing="-1.2">Activity.</text>
  <rect class="underline" x="48" y="96" width="181" height="2" fill="#ffffff" rx="1"/>

  <text class="meta" x="48" y="120" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">PLAYER 1   ·   @KURNIAWANSATRIA   ·   317 XP</text>

  <g class="xp">
    <text x="48" y="150" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="2">LVL 3</text>
    <text x="752" y="150" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4" text-anchor="end">317 / 400 XP — NEXT LVL</text>
  </g>
  <g class="xp-bar">
    <rect x="48.0" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="83.4" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="118.8" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="154.2" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="189.6" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="225.0" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="260.4" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="295.8" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="331.2" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="366.6" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="402.0" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="437.4" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="472.8" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="508.2" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="543.6" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="579.0" y="158" width="31.4" height="10" rx="2" fill="#ffffff"/>
    <rect x="614.4" y="158" width="31.4" height="10" rx="2" fill="#a3a3a3" fill-opacity="0.25"/>
    <rect x="649.8" y="158" width="31.4" height="10" rx="2" fill="#a3a3a3" fill-opacity="0.25"/>
    <rect x="685.2" y="158" width="31.4" height="10" rx="2" fill="#a3a3a3" fill-opacity="0.25"/>
    <rect x="720.6" y="158" width="31.4" height="10" rx="2" fill="#a3a3a3" fill-opacity="0.25"/>
  </g>

  <g transform="translate(48 196)">
    <g class="stat s0">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">COMMITS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">252</text>
      <text x="0" y="58" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
    </g>
  </g>

  <g transform="translate(230 196)">
    <g class="stat s1">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REPOS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">12</text>
      <text x="0" y="58" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">8 indexed</text>
    </g>
  </g>

  <g transform="translate(412 196)">
    <g class="stat s2">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">PRS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">1</text>
      <text x="0" y="58" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
    </g>
  </g>

  <g transform="translate(594 196)">
    <g class="stat s3">
      <text x="0" y="0" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REVIEWS</text>
      <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">0</text>
      <text x="0" y="58" fill="#a3a3a3" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">locked</text>
    </g>
  </g>

  <rect x="48" y="282" width="704" height="6" rx="3" fill="#a3a3a3" fill-opacity="0.2"/>

  <g class="lang-bar">
