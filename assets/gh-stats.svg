  </g>

  <g class="legend">
    <rect x="282.667" y="296" width="8" height="8" rx="2" fill="#737373"/>
    <text x="298.667" y="303" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">CSS  9%</text>
  </g>

  <g class="legend">
    <rect x="517.333" y="296" width="8" height="8" rx="2" fill="#404040"/>
    <text x="533.333" y="303" fill="#a3a3a3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">HTML  3%</text>
  </g>
</svg>
